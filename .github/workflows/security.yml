name: Security CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pytest

      # Запускаем тесты ТОЛЬКО если есть каталог tests
      - name: Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            echo "Tests directory found, running pytest..."
            pytest
          else
            echo "No tests directory, skipping pytest."
          fi

      - name: Run Bandit security scan
        run: |
          bandit -r . -ll -ii
